# Builds the Windows installer and the macOS app (Apple silicon, unsigned).
# Pushing a v* tag publishes both on a GitHub Release named after the tag; starting the
# workflow by hand from the Actions tab only attaches them to the run as artifacts.
# Builds never run on ordinary pushes: macOS minutes are costly on a private repository.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: metrodown-windows
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: metrodown-macos
            files: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # A release must carry the version it is named after.
      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          npm_v=$(node -p "require('./package.json').version")
          tauri_v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for v in "$npm_v" "$tauri_v" "$cargo_v"; do
            [ "$v" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Metrodown $GITHUB_REF_NAME" --generate-notes
